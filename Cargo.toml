[package]
name = "densezk-sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# For cryptographic finite fields and curves
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-serialize = "0.5.0"
ark-bn254 = "0.5.0"

# For poseidon hashing
light-poseidon = "0.4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Groth16 proving (local)
ark-groth16 = "0.5.0"
ark-relations = "0.5.0"
ark-snark = "0.5.0"
ark-std = "0.5.0"
rand = "0.8"

# WASM bindings
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# getrandom for WASM compatibility
getrandom = { version = "0.2", features = ["js"] }

thiserror = "1.0"

# Server dependencies (only for native builds)
actix-web = { version = "4", optional = true }
actix-cors = { version = "0.7", optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }

# Async networking
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
reqwest = { version = "0.12", features = ["json", "blocking"] }

[features]
default = ["async"]
async = ["tokio"]
sync = []
server = ["actix-web", "actix-cors", "env_logger", "log"]

[[bin]]
name = "densezk-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "network-benchmark"
path = "src/bin/network_benchmark.rs"
required-features = ["sync"]

[profile.release]
opt-level = "s"
lto = true
